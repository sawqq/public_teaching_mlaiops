# ITCS355 Lab 4 — continuous deployment (GCP).
#
# Runs only after CI succeeded on a push to main. Credentials come from workload identity
# federation (OIDC), not from stored keys: there is no JSON key anywhere in this repository
# or in its secrets.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions) is listed in
# docs/lab4-gcp-runbook.md.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    # Only a green CI run, and only one triggered by a push (never a pull request).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      # The exact commit CI tested. workflow_run otherwise checks out the tip of main, which
      # may already be a newer, untested commit.
      SHA: ${{ github.event.workflow_run.head_sha }}
      MODEL_VERSION: ${{ github.event.workflow_run.head_sha }}
      # The eight capability slots src/config.py insists on. cloud.env is gitignored, so in CI
      # they arrive as repository variables.
      CLOUD_PROVIDER: gcp
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      BLOB_URI: ${{ vars.BLOB_URI }}
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
      IDENTITY_REF: ${{ secrets.GCP_DEPLOY_SA }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-cloud-storage google-cloud-aiplatform google-cloud-monitoring

      # CI's images lived on a different runner and are gone, so build again from the same
      # commit. service/Dockerfile.serve bakes model.joblib in at /app/model.joblib (where the
      # adapter's deploy() points MODEL_PATH), so produce that file in the repo root first,
      # the same way the CI build job does.
      - name: Build serving image
        run: |
          python scripts/make_dataset.py
          python -m src.train --metrics-out reports/metrics.json
          python scripts/export_model.py --out model.joblib
          docker buildx build --platform linux/amd64 -f service/Dockerfile.serve \
            -t itcs355-serve:${SHA} --load .

      - name: Push image
        id: push
        run: python scripts/cd_steps.py push --tag itcs355-serve:${SHA}

      - name: Deploy to staging
        id: deploy
        run: |
          python scripts/cd_steps.py deploy \
            --model-ref "${{ steps.push.outputs.ref }}" \
            --endpoint "${{ vars.ENDPOINT_NAME }}" \
            --instance "${{ vars.INSTANCE_TYPE }}"

      - name: Smoke test
        run: |
          python scripts/cd_steps.py smoke \
            --endpoint "${{ steps.deploy.outputs.endpoint }}" \
            --expect-version "${SHA}"
